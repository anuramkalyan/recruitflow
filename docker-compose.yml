services:
  mysql:
    image: mysql:8.4
    container_name: recruitflow-mysql
    environment:
      MYSQL_DATABASE: recruitflow
      MYSQL_USER: recruitflow_user
      MYSQL_PASSWORD: recruitflow_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - recruitflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev_password"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  recruitflow_mysql_data:
