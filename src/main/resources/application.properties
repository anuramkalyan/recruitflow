spring.application.name=RecruitFlow

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recruitflow}
spring.datasource.username=${DB_USERNAME:recruitflow_user}
spring.datasource.password=${DB_PASSWORD:recruitflow_dev_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
